name: EAS Update - Android

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        run: |
          missing=0
          for name in EXPO_TOKEN EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            case "$name" in
              EXPO_TOKEN)                     value="${{ secrets.EXPO_TOKEN }}" ;;
              EXPO_PUBLIC_SUPABASE_URL)       value="${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" ;;
              EXPO_PUBLIC_SUPABASE_ANON_KEY)  value="${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" ;;
            esac
            if [ -z "$value" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          # The EXPO_PUBLIC_* values are inlined into the JS bundle at publish time.
          # Publishing without them ships an app that cannot reach Supabase at all.
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard against publishing a native-incompatible update
        id: guard
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "No base commit to diff against; proceeding."
            exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}" || true)
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '^(package\.json|package-lock\.json|app\.json|eas\.json)$'; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipped the OTA publish: a native-affecting file changed (package.json, package-lock.json, app.json or eas.json). Cut a new build with 'eas build' instead — an OTA update cannot add native modules to an already-installed binary."
            {
              echo "### OTA publish skipped"
              echo ""
              echo "A native-affecting file changed in this push, so no update was published."
              echo "Run \`eas build --profile production --platform android\` instead."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo
        if: steps.guard.outputs.publish == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.guard.outputs.publish == 'true'
        run: npm ci

      - name: Publish Android update
        if: steps.guard.outputs.publish == 'true'
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: >
          eas update
          --branch production
          --platform android
          --message "${{ github.event.head_commit.message || 'Manual update from GitHub' }}"
          --non-interactive
